name: parkvision

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parkvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkvision}
      POSTGRES_DB: ${POSTGRES_DB:-parkvision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - parkvision_postgres_data:/var/lib/postgresql/data
      - ../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parkvision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-parkvision}:${POSTGRES_PASSWORD:-parkvision}@postgres:5432/${POSTGRES_DB:-parkvision}
      PORT: 3001
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  parkvision_postgres_data:
